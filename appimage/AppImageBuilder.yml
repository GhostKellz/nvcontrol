version: 1

script:
  - cargo build --locked --release --bin nvctl --bin nvcontrol --features gui
  - install -Dm755 target/release/nvctl AppDir/usr/bin/nvctl
  - install -Dm755 target/release/nvcontrol AppDir/usr/bin/nvcontrol
  - install -Dm644 assets/nvcontrol.desktop AppDir/usr/share/applications/nvcontrol.desktop
  - install -Dm644 assets/app-icons/nvidia.png AppDir/usr/share/icons/hicolor/512x512/apps/nvcontrol.png

AppDir:
  path: ./AppDir

  app_info:
    id: com.github.nvcontrol
    name: nvcontrol
    icon: nvcontrol
    version: 0.8.13
    exec: usr/bin/nvcontrol
    exec_args: $@

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse'

    include:
      - libxcb1

  files:
    include:
      - /usr/lib/x86_64-linux-gnu/libxkbcommon.so*
    exclude:
      # Mesa must use its host Wayland ABI, not the build distro's older library.
      - usr/lib/**/libwayland*
      - lib/**/libwayland*
      - usr/lib/**/libnvidia*
      - usr/lib/**/libcuda*
      - usr/share/man
      - usr/share/doc

  runtime:
    env:
      LD_LIBRARY_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu:${APPDIR}/usr/lib:${LD_LIBRARY_PATH}'
      PATH: '${APPDIR}/usr/bin:${PATH}'

  test:
    debian:
      image: ubuntu:24.04
      command: ./usr/bin/nvctl --help

AppImage:
  arch: x86_64
